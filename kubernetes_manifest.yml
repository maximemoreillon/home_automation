---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-automation-env
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: home-automation-env-from-vault
    creationPolicy: Orphan
  data:
    - secretKey: MQTT_USERNAME
      remoteRef:
        key: mqtt
        property: USERNAME
    - secretKey: MQTT_PASSWORD
      remoteRef:
        key: mqtt
        property: PASSWORD
