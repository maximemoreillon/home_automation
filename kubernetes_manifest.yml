apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APPLICATION_NAME}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${APPLICATION_NAME}
  template:
    metadata:
      labels:
        app: ${APPLICATION_NAME}
    spec:
      containers:
        - name: ${APPLICATION_NAME}
          image: ${CONTAINER_IMAGE_TAGGED}
          env:
            - name: MQTT_URL
              value: mqtt://mqtt.mqtt
          envFrom:
            - secretRef:
                name: home-automation-env-from-vault
            # - secretRef:
            #     name: auth0-env
          volumeMounts:
            - mountPath: /usr/src/app/config
              name: ${APPLICATION_NAME}
          resources: {}
      volumes:
        - name: ${APPLICATION_NAME}
          configMap:
            name: ${APPLICATION_NAME}
---
# Configmap now separate
---
apiVersion: v1
kind: Service
metadata:
  name: ${APPLICATION_NAME}
spec:
  type: ClusterIP
  selector:
    app: ${APPLICATION_NAME}
  ports:
    - port: 80
